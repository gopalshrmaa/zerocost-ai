version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zerocost-postgres
    restart: always
    environment:
      POSTGRES_DB: zerocost_finops
      POSTGRES_USER: finops_admin
      POSTGRES_PASSWORD: secure_finops_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops_admin -d zerocost_finops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zerocost-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zerocost-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://finops_admin:secure_finops_password_change_in_prod@postgres:5432/zerocost_finops
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
